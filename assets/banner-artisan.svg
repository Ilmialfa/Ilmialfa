<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>

    <!-- Accent Aura Gradients -->
    <radialGradient id="auraBlue" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraPurple" cx="85%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e2e8f0" stroke-width="0.8" stroke-opacity="0.8"/>
    </pattern>

    <style>
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #2563eb; }
      .name-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 46px; font-weight: 800; letter-spacing: -0.8px; fill: url(#titleGradient); }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .subtag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="960" height="280" rx="20" fill="url(#bgGradient)"/>
  <rect width="960" height="280" rx="20" fill="url(#grid)"/>
  <rect width="960" height="280" rx="20" fill="url(#auraBlue)"/>
  <rect width="960" height="280" rx="20" fill="url(#auraPurple)"/>
  <rect width="960" height="280" rx="20" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-opacity="0.9"/>

  <!-- Top Pill Badge -->
  <g transform="translate(50, 36)">
    <rect width="320" height="28" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" class="badge-text">FULL-STACK ARTISAN &amp; TECH LEAD</text>
  </g>

  <!-- Title / Name -->
  <text x="50" y="116" class="name-text">M. Ilmi Alfaridzi</text>

  <!-- Subtitle / Bio Headline -->
  <text x="50" y="148" class="desc-text">Engineering High-Performance Web Systems, Local-First WASM, and Impactful Tech</text>

  <!-- Feature Cards Row at Bottom -->
  <!-- Card 1: Core Stack -->
  <g transform="translate(50, 184)">
    <rect width="265" height="62" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="12" y="14" width="4" height="34" rx="2" fill="#2563eb"/>
    <text x="24" y="33" class="tag-text">Laravel 12 + Next.js 16</text>
    <text x="24" y="51" class="subtag-text">React 19 &#8226; Inertia.js &#8226; Filament</text>
  </g>

  <!-- Card 2: Local-First WASM -->
  <g transform="translate(345, 184)">
    <rect width="265" height="62" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="12" y="14" width="4" height="34" rx="2" fill="#0284c7"/>
    <text x="24" y="33" class="tag-text">Local-First &amp; WASM Engine</text>
    <text x="24" y="51" class="subtag-text">FFmpeg &#8226; Tesseract &#8226; Zero-Egress</text>
  </g>

  <!-- Card 3: Leadership & Speech -->
  <g transform="translate(640, 184)">
    <rect width="270" height="62" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="12" y="14" width="4" height="34" rx="2" fill="#8b5cf6"/>
    <text x="24" y="33" class="tag-text">40+ Accolades &amp; MC Wisuda</text>
    <text x="24" y="51" class="subtag-text">UMRI Informatics &#8226; Public Speaker</text>
  </g>
</svg>
