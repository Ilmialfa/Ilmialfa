<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="230" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="brand-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .mono-tag { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; fill: #94A3B8; text-transform: uppercase; }
    .hero-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 32px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .hero-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 14.5px; font-weight: 500; fill: #CBD5E1; }
    .hero-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 12.5px; font-weight: 400; fill: #64748B; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; font-weight: 600; fill: #E2E8F0; }
    .card-title { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 600; fill: #64748B; }
    .node-title { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Container Surface with Outer Border -->
  <rect x="1" y="1" width="918" height="228" rx="12" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Background Dot Grid -->
  <rect x="1" y="1" width="918" height="228" rx="12" fill="url(#dot-grid)" />

  <!-- Left Column: Identity & Stack -->
  <g transform="translate(38, 34)">
    <!-- Status Indicator Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="284" height="22" rx="11" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <circle cx="11" cy="11" r="4" fill="#10B981" />
      <circle cx="11" cy="11" r="7" fill="#10B981" opacity="0.25" />
      <text x="24" y="15" class="mono-tag">FULL-STACK &bull; INFORMATICS @ UMRI</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="56" class="hero-name">M. Ilmi Alfaridzi</text>

    <!-- Role and Specialization -->
    <text x="0" y="84" class="hero-sub">Full-Stack Web Artisan &bull; Systems &amp; Local-First Architectures</text>
    <text x="0" y="106" class="hero-desc">Building resilient products with Laravel 12, Next.js, and WebAssembly &bull; Pekanbaru, ID</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 126)">
      <!-- Laravel -->
      <rect x="0" y="0" width="86" height="25" rx="5" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="12" y="17" class="chip-text">Laravel 12</text>

      <!-- Next.js -->
      <rect x="94" y="0" width="86" height="25" rx="5" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="106" y="17" class="chip-text">Next.js 16</text>

      <!-- React 19 -->
      <rect x="188" y="0" width="82" height="25" rx="5" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="200" y="17" class="chip-text">React 19</text>

      <!-- TypeScript -->
      <rect x="278" y="0" width="94" height="25" rx="5" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="290" y="17" class="chip-text">TypeScript</text>

      <!-- WebAssembly -->
      <rect x="380" y="0" width="102" height="25" rx="5" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="392" y="17" class="chip-text">WebAssembly</text>

      <!-- TailwindCSS -->
      <rect x="490" y="0" width="98" height="25" rx="5" fill="#111827" stroke="#1F2937" stroke-width="1" />
      <text x="502" y="17" class="chip-text">TailwindCSS</text>
    </g>
  </g>

  <!-- Right Column: Interactive Architecture Box -->
  <g transform="translate(636, 26)">
    <!-- Outer Card -->
    <rect x="0" y="0" width="248" height="178" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />

    <!-- Terminal Header Bar -->
    <rect x="0" y="0" width="248" height="26" rx="8" fill="#0B132B" />
    <line x1="0" y1="26" x2="248" y2="26" stroke="#1E293B" stroke-width="1" />
    <circle cx="12" cy="13" r="3" fill="#EF4444" opacity="0.8" />
    <circle cx="21" cy="13" r="3" fill="#F59E0B" opacity="0.8" />
    <circle cx="30" cy="13" r="3" fill="#10B981" opacity="0.8" />
    <text x="44" y="17" class="card-title">stack-overview.ts</text>

    <!-- Layer Nodes -->
    <g transform="translate(12, 38)">
      <!-- UI Layer -->
      <rect x="0" y="0" width="224" height="26" rx="4" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="17" class="node-title" fill="#38BDF8">UI: Next.js 16 + React 19</text>

      <!-- Connector Line -->
      <line x1="112" y1="26" x2="112" y2="34" stroke="#475569" stroke-width="1" stroke-dasharray="2,2" />

      <!-- Core Layer -->
      <rect x="0" y="34" width="224" height="26" rx="4" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="51" class="node-title" fill="#F87171">Core: Laravel 12 + Inertia</text>

      <!-- Connector Line -->
      <line x1="112" y1="60" x2="112" y2="68" stroke="#475569" stroke-width="1" stroke-dasharray="2,2" />

      <!-- Engine Layer -->
      <rect x="0" y="68" width="224" height="26" rx="4" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="85" class="node-title" fill="#34D399">Engine: WASM + MySQL / SQLite</text>
    </g>

    <!-- Status pill at bottom of card -->
    <g transform="translate(12, 150)">
      <circle cx="5" cy="5" r="3" fill="#34D399" />
      <text x="14" y="9" font-family="ui-monospace, monospace" font-size="9.5" fill="#94A3B8">Zero-server client privacy enabled</text>
    </g>
  </g>

  <!-- Glowing Accent Baseline -->
  <line x1="38" y1="228" x2="882" y2="228" stroke="url(#brand-glow)" stroke-width="2.5" />
</svg>
