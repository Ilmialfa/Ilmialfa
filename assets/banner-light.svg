<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="230" fill="none">
  <defs>
    <pattern id="grid-light" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E2E8F0" opacity="0.8" />
    </pattern>
    <linearGradient id="glow-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <style>
    .mono-sys { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; fill: #64748B; text-transform: uppercase; }
    .title-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 32px; font-weight: 700; fill: #0F172A; letter-spacing: -0.6px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 14.5px; font-weight: 400; fill: #334155; }
    .meta-line { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 12.5px; font-weight: 400; fill: #64748B; }
    .pill-text { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; font-weight: 600; fill: #1E293B; }
    .blueprint-title { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 600; fill: #64748B; }
    .layer-label { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10.5px; font-weight: 600; }
  </style>

  <!-- Canvas Surface -->
  <rect x="1" y="1" width="918" height="228" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- Subtle Geometric Dot Grid -->
  <rect x="1" y="1" width="918" height="228" rx="12" fill="url(#grid-light)" />

  <!-- Left Content Column -->
  <g transform="translate(42, 36)">
    <!-- Status / Header Identifier -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="5" r="4" fill="#059669" />
      <circle cx="4" cy="5" r="8" fill="#059669" opacity="0.2" />
      <text x="18" y="9" class="mono-sys">SOFTWARE ENGINEERING &bull; INFORMATICS @ UMRI</text>
    </g>

    <!-- Name Heading -->
    <text x="0" y="44" class="title-name">M. Ilmi Alfaridzi</text>

    <!-- Role Statement -->
    <text x="0" y="73" class="subtitle">Crafting high-performance web systems &amp; local-first client applications.</text>
    <text x="0" y="96" class="meta-line">Full-Stack Developer &bull; Laravel, Next.js, and WebAssembly ecosystems &bull; Pekanbaru, ID</text>

    <!-- Curated Stack Badges -->
    <g transform="translate(0, 122)">
      <!-- Laravel -->
      <rect x="0" y="0" width="86" height="25" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="17" class="pill-text">Laravel 12</text>

      <!-- Next.js -->
      <rect x="94" y="0" width="86" height="25" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="105" y="17" class="pill-text">Next.js 16</text>

      <!-- React 19 -->
      <rect x="188" y="0" width="82" height="25" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="199" y="17" class="pill-text">React 19</text>

      <!-- TypeScript -->
      <rect x="278" y="0" width="94" height="25" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="289" y="17" class="pill-text">TypeScript</text>

      <!-- WebAssembly -->
      <rect x="380" y="0" width="102" height="25" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="391" y="17" class="pill-text">WebAssembly</text>

      <!-- Tailwind -->
      <rect x="490" y="0" width="96" height="25" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="502" y="17" class="pill-text">TailwindCSS</text>
    </g>
  </g>

  <!-- Right Architecture Blueprint Card -->
  <g transform="translate(632, 28)">
    <rect x="0" y="0" width="252" height="174" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />

    <!-- Card Header -->
    <rect x="0" y="0" width="252" height="28" rx="8" fill="#FFFFFF" />
    <line x1="0" y1="28" x2="252" y2="28" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="14" cy="14" r="3" fill="#EF4444" opacity="0.8" />
    <circle cx="24" cy="14" r="3" fill="#F59E0B" opacity="0.8" />
    <circle cx="34" cy="14" r="3" fill="#10B981" opacity="0.8" />
    <text x="48" y="18" class="blueprint-title">system-architecture.ts</text>

    <!-- Layers -->
    <g transform="translate(14, 40)">
      <!-- UI Layer -->
      <rect x="0" y="0" width="224" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
      <text x="10" y="17" class="layer-label" fill="#0284C7">UI: Next.js 16 + React 19</text>

      <!-- Connection -->
      <line x1="112" y1="26" x2="112" y2="34" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2" />

      <!-- Core Backend -->
      <rect x="0" y="34" width="224" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
      <text x="10" y="51" class="layer-label" fill="#DC2626">Backend: Laravel 12 + Inertia</text>

      <!-- Connection -->
      <line x1="112" y1="60" x2="112" y2="68" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2,2" />

      <!-- Compute / Storage Engine -->
      <rect x="0" y="68" width="224" height="26" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8" />
      <text x="10" y="85" class="layer-label" fill="#059669">Engine: WASM + MySQL / SQLite</text>
    </g>

    <!-- Bottom Status Note inside card -->
    <g transform="translate(14, 150)">
      <circle cx="4" cy="4" r="3" fill="#059669" />
      <text x="14" y="8" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B">Zero-server client privacy enabled</text>
    </g>
  </g>

  <!-- Sleek Accent Baseline Gradient -->
  <line x1="42" y1="228" x2="878" y2="228" stroke="url(#glow-light)" stroke-width="2" />
</svg>
