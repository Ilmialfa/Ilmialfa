<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2F6" />
    </linearGradient>
    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="subtleOrb1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="subtleOrb2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.04" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: url(#primaryTextGrad); letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 16px; fill: #475569; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13.5px; fill: #64748B; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #334155; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11.5px; fill: #059669; }
    .code-accent { font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #2563EB; }
  </style>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="846" height="256" rx="20" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="750" cy="40" r="140" fill="url(#subtleOrb1)" />
  <circle cx="100" cy="220" r="120" fill="url(#subtleOrb2)" />
  <circle cx="680" cy="200" r="90" fill="url(#subtleOrb1)" />

  <!-- Decorative Grid Dots -->
  <g opacity="0.35" fill="#94A3B8">
    <circle cx="710" cy="70" r="1.5" /><circle cx="730" cy="70" r="1.5" /><circle cx="750" cy="70" r="1.5" /><circle cx="770" cy="70" r="1.5" />
    <circle cx="710" cy="90" r="1.5" /><circle cx="730" cy="90" r="1.5" /><circle cx="750" cy="90" r="1.5" /><circle cx="770" cy="90" r="1.5" />
    <circle cx="710" cy="110" r="1.5" /><circle cx="730" cy="110" r="1.5" /><circle cx="750" cy="110" r="1.5" /><circle cx="770" cy="110" r="1.5" />
  </g>

  <!-- Live Status Pill -->
  <g transform="translate(48, 36)">
    <rect width="194" height="28" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="14" cy="14" r="4" fill="#10B981" />
    <text x="26" y="18" class="status-text">Available for collaborations</text>
  </g>

  <!-- Main Identity Header -->
  <g transform="translate(48, 104)">
    <text x="0" y="0" class="title">M. Ilmi Alfaridzi</text>
    <text x="0" y="28" class="subtitle">Full-Stack Web Developer &amp; Tech Organizer</text>
    <text x="0" y="50" class="tagline">Crafting modern web architectures with Laravel, Next.js &amp; local-first privacy tools.</text>
  </g>

  <!-- Aesthetic Pill Chips -->
  <g transform="translate(48, 190)">
    <g transform="translate(0, 0)">
      <rect width="158" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="17" cy="17" r="7" fill="#EFF6FF" />
      <text x="13" y="21" class="code-accent">⚡</text>
      <text x="32" y="21.5" class="badge-text">Laravel &amp; Next.js</text>
    </g>

    <g transform="translate(170, 0)">
      <rect width="128" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="17" cy="17" r="7" fill="#FEF3C7" />
      <text x="13" y="21" class="code-accent">🏆</text>
      <text x="32" y="21.5" class="badge-text">40+ Awards</text>
    </g>

    <g transform="translate(310, 0)">
      <rect width="168" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="17" cy="17" r="7" fill="#F3E8FF" />
      <text x="13" y="21" class="code-accent">🎙️</text>
      <text x="32" y="21.5" class="badge-text">MC &amp; Organizer</text>
    </g>

    <g transform="translate(490, 0)">
      <rect width="144" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="17" cy="17" r="7" fill="#FEE2E2" />
      <text x="13" y="21" class="code-accent">📍</text>
      <text x="32" y="21.5" class="badge-text">Indonesia</text>
    </g>
  </g>

  <!-- Right Side Accent Graphic -->
  <g transform="translate(680, 126)">
    <rect x="0" y="0" width="116" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <line x1="0" y1="24" x2="116" y2="24" stroke="#F1F5F9" stroke-width="1.2" />
    <circle cx="16" cy="12" r="3.5" fill="#EF4444" opacity="0.8" />
    <circle cx="28" cy="12" r="3.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="40" cy="12" r="3.5" fill="#10B981" opacity="0.8" />
    <text x="14" y="47" class="code-accent">&lt;ilmi.dev&gt;</text>
    <text x="18" y="65" font-family="monospace" font-size="9.5" fill="#64748B">status: 200</text>
    <text x="14" y="82" class="code-accent">&lt;/build&gt;</text>
  </g>
</svg>