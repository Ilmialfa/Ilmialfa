<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="200" fill="none">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E2E8F0" />
    </pattern>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    .mono-label { font-family: ui-monospace, 'SF Mono', 'Fira Code', Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; fill: #64748B; text-transform: uppercase; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #0F172A; letter-spacing: -0.5px; }
    .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #334155; }
    .meta { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #64748B; }
    .tech-pill-text { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; font-weight: 500; fill: #334155; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="878" height="198" rx="12" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- Subtle Dot Grid Background -->
  <rect x="1" y="1" width="878" height="198" rx="12" fill="url(#grid)" opacity="0.75" />

  <!-- Left Content -->
  <g transform="translate(44, 38)">
    <text x="0" y="0" class="mono-label">Portfolio &bull; Web Engineering &bull; UMRI</text>
    <text x="0" y="36" class="name">M. Ilmi Alfaridzi</text>
    <text x="0" y="66" class="role">Full-Stack Web Developer &amp; Informatics Student</text>
    <text x="0" y="90" class="meta">Focused on Laravel, Next.js, and TypeScript ecosystems &bull; Pekanbaru, Indonesia</text>
    
    <!-- Minimalist Tech Stack Pills -->
    <g transform="translate(0, 114)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="86" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="16" class="tech-pill-text">Laravel</text>

      <!-- Tag 2 -->
      <rect x="94" y="0" width="84" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="106" y="16" class="tech-pill-text">Next.js</text>

      <!-- Tag 3 -->
      <rect x="186" y="0" width="76" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="198" y="16" class="tech-pill-text">React</text>

      <!-- Tag 4 -->
      <rect x="270" y="0" width="108" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="282" y="16" class="tech-pill-text">TypeScript</text>

      <!-- Tag 5 -->
      <rect x="386" y="0" width="112" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="398" y="16" class="tech-pill-text">Tailwind CSS</text>
    </g>
  </g>

  <!-- Right Side Architectural Schematic (Clean Vector Geometry) -->
  <g transform="translate(640, 36)" opacity="0.9">
    <!-- Frame -->
    <rect x="0" y="0" width="196" height="128" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="196" height="26" rx="8" fill="#F8FAFC" />
    <line x1="0" y1="26" x2="196" y2="26" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="14" cy="13" r="3" fill="#CBD5E1" />
    <circle cx="24" cy="13" r="3" fill="#CBD5E1" />
    <circle cx="34" cy="13" r="3" fill="#CBD5E1" />
    <text x="50" y="17" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">stack-overview.ts</text>

    <!-- Schematic Layers -->
    <g transform="translate(14, 38)">
      <!-- Client Layer -->
      <rect x="0" y="0" width="168" height="22" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#2563EB">Client: Next.js + React 19</text>

      <!-- Connector Line -->
      <line x1="84" y1="22" x2="84" y2="30" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2,2" />

      <!-- Core Backend Layer -->
      <rect x="0" y="30" width="168" height="22" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="45" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#0F172A">Core: Laravel 12 + Inertia</text>

      <!-- Connector Line -->
      <line x1="84" y1="52" x2="84" y2="60" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2,2" />

      <!-- Compute / Storage Layer -->
      <rect x="0" y="60" width="168" height="22" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="75" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#059669">WASM / SQLite / MySQL</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="44" y1="198" x2="836" y2="198" stroke="url(#lineGrad)" stroke-width="2" />
</svg>
